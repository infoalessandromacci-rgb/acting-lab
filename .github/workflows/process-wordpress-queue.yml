name: Process WordPress queue

on:
  push:
    branches: [main]
    paths:
      - 'queue/pending/*.json'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: acting-lab-wordpress-queue
  cancel-in-progress: false

jobs:
  process:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Process pending WordPress commands
        id: process
        continue-on-error: true
        env:
          WP_URL: ${{ secrets.WP_URL }}
          WP_USERNAME: ${{ secrets.WP_USERNAME }}
          WP_APP_PASSWORD: ${{ secrets.WP_APP_PASSWORD }}
        run: python3 scripts/process_queue.py

      - name: Commit queue results
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add queue
          if git diff --cached --quiet; then
            echo "No queue changes to commit"
          else
            git commit -m "Process WordPress queue"
            git push
          fi

      - name: Fail workflow when a command failed
        if: steps.process.outcome == 'failure'
        run: exit 1
